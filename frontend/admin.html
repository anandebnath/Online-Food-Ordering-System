<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Tasty Bites</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🍔 Tasty Bites Admin</div>
    <ul class="nav-links">
      <li><a href="index.html">View Site</a></li>
      <li id="authLink"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2 class="section-title">Admin Dashboard</h2>

    <div class="admin-tabs">
      <button id="btn-foods" onclick="showAdminTab('foods')">Manage Foods</button>
      <button id="btn-orders" onclick="showAdminTab('orders')">Manage Orders</button>
    </div>

    <!-- Foods Tab -->
    <div id="foodsTab">
      <div class="form-wrapper" style="margin:0 0 30px 0; max-width:100%;">
        <h2>Add New Food Item</h2>
        <form id="addFoodForm">
          <div class="form-group">
            <label>Food Name</label>
            <input type="text" id="foodName" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="foodCategory" placeholder="e.g. Pizza, Rice, Drinks" required>
          </div>
          <div class="form-group">
            <label>Price (৳)</label>
            <input type="number" id="foodPrice" required>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="foodImage" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="foodDesc" rows="2"></textarea>
          </div>
          <button type="submit" class="btn">Add Food Item</button>
        </form>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="foodsTableBody"></tbody>
      </table>
    </div>

    <!-- Orders Tab -->
    <div id="ordersTab" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    &copy; 2026 Tasty Bites Online Food Ordering System. All rights reserved by Anan & Sana.
  </footer>

  <script src="js/script.js"></script>
  <script src="js/admin.js"></script>
  adc
</body>
</html>
