<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Tasty Bites</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🍔 Tasty Bites</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="cart.html">Cart <span class="cart-badge" id="cartCount">0</span></a></li>
      <li id="authLink"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="form-wrapper">
    <h2>Create Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn">Register</button>
      <p id="formMsg"></p>
    </form>
    <p class="form-footer-text">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <footer>
    &copy; 2026 Tasty Bites Online Food Ordering System. All rights reserved.
  </footer>

  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
